name: Backend CI/CD

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  test:
    name: Test (unit + IT)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Docker info (Testcontainers)
        run: docker info

      - name: Connectivity check (Maven Central)
        run: |
          curl -I https://repo.maven.apache.org/maven2/ | head -n 5
          curl -I https://repo1.maven.org/maven2/ | head -n 5
          curl -I https://services.gradle.org/distributions/gradle-8.14.3-bin.zip | head -n 5


      - name: Make gradlew executable
        working-directory: DoableWellbeingBackend
        run: chmod +x gradlew

      - name: Run tests
        working-directory: DoableWellbeingBackend
        env:
          SPRING_PROFILES_ACTIVE: test
        run: ./gradlew clean test --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/test-results/test


  sonar:
    name: SonarCloud (Quality Gate)
    runs-on: ubuntu-latest
    needs: [ test ]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Make gradlew executable
        working-directory: DoableWellbeingBackend
        run: chmod +x gradlew

      
      - name: Build + Test + Coverage
        working-directory: DoableWellbeingBackend
        env:
          SPRING_PROFILES_ACTIVE: test
        run: ./gradlew test jacocoTestReport --no-daemon

      - name: SonarCloud Scan
        working-directory: DoableWellbeingBackend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORG: deltazorzz
          SONAR_PROJECT_KEY: doablewellbeing
        run: ./gradlew sonar --no-daemon
    
      
      - name: SonarCloud Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.1.0
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}


  docker:
    name: DockerHub push
    runs-on: ubuntu-latest
    needs: [ sonar ]
    
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/doablewellbeing-backend:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/doablewellbeing-backend:${{ github.sha }}
