name: Backend CI (Tests + SonarCloud) + DockerHub Push

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  test-and-sonar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run tests + JaCoCo
        working-directory: DoableWellbeingBackend
        run: ./gradlew clean test jacocoTestReport

      - name: SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar -Dsonar.login=${SONAR_TOKEN}

  docker-build-and-push:
    runs-on: ubuntu-latest
    needs: test-and-sonar
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          SHA=${GITHUB_SHA::7}
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "TAGS=${{ secrets.DOCKERHUB_USERNAME }}/doable-backend:latest,${{ secrets.DOCKERHUB_USERNAME }}/doable-backend:main-${SHA}" >> $GITHUB_OUTPUT
          else
            echo "TAGS=${{ secrets.DOCKERHUB_USERNAME }}/doable-backend:dev-latest,${{ secrets.DOCKERHUB_USERNAME }}/doable-backend:dev-${SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
