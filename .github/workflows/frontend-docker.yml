name: Frontend Docker CI

on:
  push:
    branches: [ "dev", "main", "master" ]
  pull_request:
    branches: [ "dev", "main", "master" ]

jobs:
  e2e:
    name: E2E (Backend e2e profile + Cypress)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: doablewellbeing
          POSTGRES_USER: dw
          POSTGRES_PASSWORD: dwpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U dw -d doablewellbeing"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ---------------------------
      # Backend (Spring Boot)
      # ---------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Start backend (profile=e2e)
        working-directory: DoableWellbeingBackend
        run: |
          nohup ./gradlew bootRun --no-daemon -Dspring.profiles.active=e2e > backend.log 2>&1 &
          echo "Backend started"

      - name: Wait for backend
        run: |
          for i in {1..60}; do
            if curl -sf http://localhost:8080/actuator/health >/dev/null; then
              echo "Backend is up"
              exit 0
            fi
            echo "Waiting for backend..."
            sleep 2
          done
          echo "Backend did not start in time"
          echo "---- backend.log ----"
          tail -n 200 doablewellbeing-backend/backend.log || true
          exit 1

      # ---------------------------
      # Frontend (Next.js)
      # ---------------------------
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: doablewellbeing-frontend/package-lock.json

      - name: Install frontend deps
        working-directory: doablewellbeing-frontend
        run: npm ci

      - name: Build frontend
        working-directory: doablewellbeing-frontend
     
        run: npm run build

      - name: Start frontend
        working-directory: doablewellbeing-frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
          PORT: 3000
        run: |
          nohup npm run start -- -p 3000 > frontend.log 2>&1 &
          echo "Frontend started"

      - name: Wait for frontend
        run: |
          for i in {1..60}; do
            if curl -sf http://localhost:3000 >/dev/null; then
              echo "Frontend is up"
              exit 0
            fi
            echo "Waiting for frontend..."
            sleep 2
          done
          echo "Frontend did not start in time"
          echo "---- frontend.log ----"
          tail -n 200 doablewellbeing-frontend/frontend.log || true
          exit 1

      # ---------------------------
      # Cypress E2E
      # ---------------------------
      - name: Run Cypress E2E
        working-directory: doablewellbeing-frontend
        env:
          CYPRESS_baseUrl: http://localhost:3000
          CYPRESS_apiBaseUrl: http://localhost:8080
 
        run: npx cypress run

      - name: Upload logs/videos/screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            doablewellbeing-backend/backend.log
            doablewellbeing-frontend/frontend.log
            doablewellbeing-frontend/cypress/videos
            doablewellbeing-frontend/cypress/screenshots

  build-and-push:
    name: Build & Push Docker image
    runs-on: ubuntu-latest
    needs: e2e
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/dw-frontend

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: doablewellbeing-frontend
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
