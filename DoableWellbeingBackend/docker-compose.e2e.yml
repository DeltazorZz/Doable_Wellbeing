version: "3.9"
services:
  postgres-e2e:
    image: postgres:16-alpine
    container_name: dw-postgres-e2e
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: dw_e2e
      POSTGRES_USER: dw
      POSTGRES_PASSWORD: dwpass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dw -d dw_e2e"]
      interval: 2s
      timeout: 5s
      retries: 30

  backend-e2e:

    build: .
    container_name: dw-backend-e2e
    depends_on:
      postgres-e2e:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: e2e
