# --- DataSource (Docker Postgres) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/doablewellbeing
spring.datasource.username=dw
spring.datasource.password=dwpass
#${DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password}

# --- JPA/Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=false

# JWT (HS256)
app.security.jwt.issuer=doable-wellbeing
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.roles-claim=roles
app.security.jwt.access-minutes=15
app.security.jwt.refresh-days=14
app.security.password.pepper=${PASSWORD_PEPPER}

#Google Meet API
google.calendar.enabled=false
google.calendar.application-name="DoableWellbeing"
google.calendar.client-id=${GOOGLE_OAUTH_CLIENT_ID}
google.calendar.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET}
google.calendar.refresh-token=${GOOGLE_OAUTH_REFRESH_TOKEN}
google.calendar.calendar-id=50d0e41c0f0d77ee9bfabf90cb7c5fa34cf0e0c1b10e0b19299d2a1992ddfe73@group.calendar.google.com
google.oauth.redirect-uri=${GOOGLE_REDIRECT_URI}

# Cookie Settings
app.security.cookie.secure=true
app.security.cookie.samesite=Strict
app.security.cookie.domain=

# CORS frontendhez (Next.js default :3000)
app.cors.allowed-origins=http://localhost:3000, http://127.0.0.1:3000

