spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.schemas=public
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

# Hikari ? hagyhatod, de tesztben elég kicsi pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.initialization-fail-timeout=60000
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- JWT test config ---
app.security.jwt.secret=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
app.security.jwt.issuer=doable-wellbeing
app.security.jwt.roles-claim=roles
app.security.jwt.access-minutes=15
app.security.jwt.refresh-days=14
app.security.password.pepper=AAAAAAAAAAAAAAAAAAAA

# Google cuccok OFF tesztben (különben context init is lehet flakey / lassú)
google.calendar.enabled=false

# Cookie Settings (ha kell)
app.security.cookie.secure=false
app.security.cookie.samesite=Lax
app.security.cookie.domain=


